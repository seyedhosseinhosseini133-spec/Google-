  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Google Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    :root{--bg:#f2f2f7;--surface:#fff;--ink:#172033;--muted:#667085;--line:#e7e9f0;--blue:#2563eb;--glass:rgba(255,255,255,.84)}
    [data-theme=dark]{--bg:#10131c;--surface:#202636;--ink:#f5f7ff;--muted:#abb5ca;--line:#384155;--blue:#85b5ff;--glass:rgba(32,38,54,.88)}
    html,body{margin:0;width:100%;font-family:Vazirmatn,sans-serif;color:var(--ink)}
    body{min-height:calc(100 * min(var(--vh, 1vh), 1vh))}
    button,a,input{font:inherit}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #76a9ff;outline-offset:3px}
    .app-wrapper{width:100%;min-height:calc(100 * min(var(--vh, 1vh), 1vh));background:var(--bg);position:relative;overflow:hidden;isolation:isolate}
    .app-wrapper:before,.app-wrapper:after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(75px);opacity:.65}
    .app-wrapper:before{width:360px;height:360px;right:-165px;top:-180px;background:#93b8ff88}
    .app-wrapper:after{width:290px;height:290px;left:-170px;top:300px;background:#ffc89e88}
    .shell{position:relative;max-width:510px;margin:auto;padding:env(safe-area-inset-top) 18px calc(116px + env(safe-area-inset-bottom))}
    .status{display:flex;justify-content:space-between;align-items:center;padding:12px 7px 15px;direction:ltr;font-size:13px;font-weight:700}
    .signal{display:flex;align-items:center;gap:6px;color:var(--muted)}.signal svg{width:17px;height:17px}
    .widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .widget{min-height:139px;border-radius:25px;padding:17px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;position:relative;box-shadow:0 14px 28px #17203324;border:1px solid #ffffff35;transition:transform .25s}
    .widget:hover{transform:translateY(-3px)}.widget:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;left:-38px;top:-52px;border:25px solid #ffffff1c;pointer-events:none}
    .clock{background:linear-gradient(145deg,#4387f5,#1855bd)}.greeting{background:linear-gradient(145deg,#f16974,#ec7835)}
    .widget-top{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;position:relative;z-index:1}
    .widget-top svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
    .widget-big{font-size:27px;font-weight:800;line-height:1.3;position:relative;z-index:1;font-variant-numeric:tabular-nums}
    .widget-detail{font-size:11px;opacity:.94;position:relative;z-index:1}
    .brand{text-align:center;padding:28px 0 23px;direction:ltr}
    .logo{font-family:Arial,sans-serif;font-weight:600;font-size:clamp(48px,13vw,64px);letter-spacing:-4px;line-height:1;filter:drop-shadow(0 7px 18px #4285f430)}
    .b{color:#4285f4}.r{color:#ea4335}.y{color:#fbbc05}.g{color:#34a853}
    .search-area{position:relative;z-index:5}
    .search-box{height:62px;display:flex;align-items:center;gap:10px;padding:0 13px;background:var(--surface);border:1px solid var(--line);border-radius:21px;box-shadow:0 12px 30px #17203319;transition:box-shadow .2s,transform .2s}
    .search-box:focus-within{outline:2px solid var(--blue);outline-offset:2px;box-shadow:0 16px 35px #2563eb25;transform:translateY(-2px)}
    .search-icon{width:21px;height:21px;color:var(--blue);flex:none}
    input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-size:15px}input::placeholder{color:var(--muted)}
    .icon-action{display:grid;place-items:center;width:39px;height:39px;flex:none;border:0;border-radius:12px;background:#edf4ff;color:#2563eb;cursor:pointer;text-decoration:none;transition:transform .2s}
    .icon-action:hover{transform:scale(1.07)}[data-theme=dark] .icon-action{background:#344565;color:#b5d0ff}
    .icon-action svg{width:20px;height:20px}.clear{background:transparent;color:var(--muted);width:30px}.clear[hidden]{display:none}
    .suggestions{position:absolute;top:70px;right:0;left:0;display:none;max-height:265px;overflow:auto;padding:7px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 45px #17203330;list-style:none;margin:0}
    .suggestions.show{display:block}.suggestions button{width:100%;padding:11px 12px;text-align:right;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}.suggestions button:hover,.suggestions button.active{background:var(--bg)}
    .section-heading{display:flex;align-items:center;justify-content:space-between;margin:27px 2px 15px}h1{font-size:20px;font-weight:800;margin:0}h2{font-size:19px;font-weight:800;margin:0}
    .section-link{color:var(--blue);font-size:13px;font-weight:700;text-decoration:none;background:var(--surface);padding:7px 13px;border:1px solid var(--line);border-radius:11px;cursor:pointer}
    .app-grid,.sheet-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px 5px}
    .app-link{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;text-decoration:none;color:var(--ink);font-size:11px;font-weight:600}
    .app-link:hover .app-icon{transform:translateY(-4px)}.app-icon{width:clamp(56px,17vw,68px);height:clamp(56px,17vw,68px);padding:12px;border-radius:20px;background:var(--surface);display:grid;place-items:center;box-shadow:0 8px 20px #17203318,inset 0 0 0 1px var(--line);transition:transform .2s}.app-icon svg{width:100%;height:100%}
    .recent{background:var(--surface);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 8px 24px #1720330c}
    .recent-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}.recent-empty[hidden]{display:none}
    .history-row{display:flex;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid var(--line)}.history-row:last-child{border:0}
    .history-open{flex:1;text-align:right;color:var(--ink);border:0;background:none;padding:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.history-delete{border:0;background:var(--bg);color:var(--muted);border-radius:9px;width:32px;height:32px;cursor:pointer}
    .dock{position:fixed;z-index:10;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 34px),474px);display:flex;align-items:center;justify-content:space-around;gap:8px;padding:9px;background:var(--glass);border:1px solid #ffffff80;border-radius:25px;box-shadow:0 15px 45px #17203335;backdrop-filter:blur(22px)}
    .dock a,.dock button{width:51px;height:51px;display:grid;place-items:center;color:#fff;border:0;border-radius:16px;cursor:pointer;transition:transform .2s}.dock a:hover,.dock button:hover{transform:translateY(-3px)}.dock svg{width:25px;height:25px}
    .dock .mail{background:linear-gradient(145deg,#f36c62,#cf3e37)}.dock .apps{background:linear-gradient(145deg,#61a0ff,#2563db)}.dock .theme{background:linear-gradient(145deg,#9a8eea,#655ac9)}.dock .settings{background:linear-gradient(145deg,#8895a7,#566173)}
    .overlay{position:fixed;z-index:20;inset:0;background:#10152292;display:none}.overlay.show{display:block}
    .sheet{position:fixed;z-index:21;bottom:0;left:50%;transform:translate(-50%,105%);width:min(100%,510px);max-height:85%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:15px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 45px #10152235;transition:transform .28s}.sheet.show{transform:translate(-50%,0)}
    .handle{width:36px;height:5px;background:var(--muted);opacity:.4;border-radius:10px;margin:0 auto 15px}.sheet h2{margin-bottom:15px}
    .sheet-search{width:100%;height:45px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:19px}.sheet-grid{gap:19px 5px}.sheet-grid .app-icon{width:57px;height:57px}
    .setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);padding:17px;border-bottom:1px solid var(--line)}.setting-row:first-of-type{border-radius:16px 16px 0 0}.setting-row:last-of-type{border-radius:0 0 16px 16px;border:0}
    .switch{width:52px;height:31px;background:#a2a9b7;border:0;border-radius:30px;padding:3px;cursor:pointer;direction:ltr}.switch:before{content:"";display:block;width:25px;height:25px;background:#fff;border-radius:50%;transition:transform .2s}.switch.on{background:#34c759}.switch.on:before{transform:translateX(21px)}
    .sheet-close{width:100%;margin-top:18px;padding:13px;background:var(--surface);border:0;border-radius:14px;color:var(--blue);font-weight:700;cursor:pointer}
    .toast{position:fixed;z-index:30;top:55px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;display:none;white-space:nowrap}.toast.show{display:block}
    @media(max-width:350px){.shell{padding-left:12px;padding-right:12px}.widget{padding:13px}.widget-big{font-size:23px}.app-icon{padding:9px}}
    @media(min-width:700px){.app-wrapper{max-width:510px;margin:0 auto;box-shadow:0 20px 70px #17203324}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

    /* =========================================================
       🔥 افکت انیمیشن تغییر تم (View Transitions)
    ========================================================= */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    
    /* Fallback برای مرورگرهای قدیمی که View Transitions ندارند */
    html.fallback-transition,
    html.fallback-transition *,
    html.fallback-transition *::before,
    html.fallback-transition *::after {
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease !important;
    }

  <script>
    const $=id=>document.getElementById(id);
    const q=$('q'),suggestions=$('suggestions'),clearBtn=$('clearBtn');
    [...$('appSources').children].forEach(a=>{
      $('appGrid').appendChild(a.cloneNode(true));
      $('sheetGrid').appendChild(a);
    });
    const recent=[];
    const samples=['آب و هوای امروز','ترجمه انگلیسی به فارسی','نقشه تهران','اخبار امروز','تقویم شمسی امروز'];
    function clock(){
      const d=new Date(),hour=d.getHours();
      $('statusTime').textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit'}).format(d);
      $('wTime').textContent=new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(d);
      $('wDate').textContent=new Intl.DateTimeFormat('fa-IR',{weekday:'long',day:'numeric',month:'long'}).format(d);
      $('wGreet').textContent=hour<5?'شب بخیر':hour<12?'صبح بخیر':hour<17?'ظهر بخیر':hour<21?'عصر بخیر':'شب بخیر';
    }
    clock();setInterval(clock,30000);
    function notify(message){const t=$('toast');t.textContent=message;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),2200)}
    function renderHistory(){
      const wrap=$('historyWrap');
      [...wrap.querySelectorAll('.history-row')].forEach(row=>row.remove());
      wrap.querySelector('[data-template-id="history-empty-message"]').hidden=recent.length>0;
      recent.forEach(value=>{
        const row=document.createElement('div');row.className='history-row';
        const open=document.createElement('button');open.className='history-open';open.type='button';open.textContent=value;open.onclick=()=>search(value);
        const remove=document.createElement('button');remove.className='history-delete';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','حذف '+value);
        remove.onclick=()=>{recent.splice(recent.indexOf(value),1);renderHistory()};
        row.append(open,remove);wrap.appendChild(row);
      });
    }
    function search(value){
      const term=value.trim();if(!term){q.focus();return}
      const old=recent.indexOf(term);if(old>=0)recent.splice(old,1);
      recent.unshift(term);if(recent.length>12)recent.pop();
      renderHistory();hideSuggestions();
      window.open('https://www.google.com/search?q='+encodeURIComponent(term),'_blank','noopener,noreferrer');
    }
    $('searchForm').addEventListener('submit',e=>{e.preventDefault();search(q.value)});
    function hideSuggestions(){suggestions.classList.remove('show');suggestions.replaceChildren()}
    function showSuggestions(){
      suggestions.replaceChildren();
      const term=q.value.trim().toLowerCase();
      const options=[...new Set([...recent,...samples])].filter(v=>!term||v.toLowerCase().includes(term)).slice(0,6);
      options.forEach(value=>{
        const li=document.createElement('li'),btn=document.createElement('button');
        btn.type='button';btn.textContent=value;btn.onclick=()=>{q.value=value;clearBtn.hidden=false;search(value)};
        li.appendChild(btn);suggestions.appendChild(li);
      });
      suggestions.classList.toggle('show',options.length>0);
    }
    q.addEventListener('focus',showSuggestions);
    q.addEventListener('input',()=>{clearBtn.hidden=!q.value;showSuggestions()});
    q.addEventListener('keydown',e=>{
      const buttons=[...suggestions.querySelectorAll('button')],active=buttons.findIndex(b=>b.classList.contains('active'));
      if(e.key==='Escape')hideSuggestions();
      if((e.key==='ArrowDown'||e.key==='ArrowUp')&&buttons.length){
        e.preventDefault();buttons.forEach(b=>b.classList.remove('active'));
        const next=e.key==='ArrowDown'?(active+1)%buttons.length:(active-1+buttons.length)%buttons.length;
        buttons[next].classList.add('active');buttons[next].focus();
      }
    });
    suggestions.addEventListener('keydown',e=>{if(e.key==='Escape'){hideSuggestions();q.focus()}});
    clearBtn.onclick=()=>{q.value='';clearBtn.hidden=true;hideSuggestions();q.focus()};
    document.addEventListener('click',e=>{if(!e.target.closest('.search-area'))hideSuggestions()});
    $('clearHistoryBtn').onclick=()=>{if(!recent.length){notify('تاریخچه خالی است');return}recent.length=0;renderHistory();notify('تاریخچه پاک شد')};
    
    function theme(mode){
      document.documentElement.dataset.theme=mode;
      const on=mode==='dark';$('themeSwitch').classList.toggle('on',on);
      $('themeSwitch').setAttribute('aria-checked',String(on));
    }

    /* 🔥 تابع انیمیشن دار کردن تغییر تم */
    function toggleTheme(e) {
      const isDark = document.documentElement.dataset.theme === 'dark';
      const newMode = isDark ? 'light' : 'dark';
      
      // پیدا کردن مختصات کلیک برای شروع انیمیشن دایره‌ای
      const x = e && e.clientX ? e.clientX : window.innerWidth / 2;
      const y = e && e.clientY ? e.clientY : window.innerHeight / 2;

      // بررسی اینکه آیا مرورگر از View Transitions پشتیبانی می‌کند یا نه
      if (!document.startViewTransition) {
        // Fallback: استفاده از انیمیشن نرم CSS
        document.documentElement.classList.add('fallback-transition');
        theme(newMode);
        setTimeout(() => document.documentElement.classList.remove('fallback-transition'), 400);
        return;
      }

      // اجرای View Transition
      const transition = document.startViewTransition(() => {
        theme(newMode);
      });

      // اجرای انیمیشن دایره‌ای از نقطه کلیک شده
      transition.ready.then(() => {
        const right = window.innerWidth - x;
        const bottom = window.innerHeight - y;
        const maxRadius = Math.hypot(Math.max(x, right), Math.max(y, bottom));

        document.documentElement.animate(
          {
            clipPath: [
              `circle(0px at ${x}px ${y}px)`,
              `circle(${maxRadius}px at ${x}px ${y}px)`
            ]
          },
          {
            duration: 600,
            easing: 'ease-in-out',
            pseudoElement: '::view-transition-new(root)'
          }
        );
      });
    }

    // اتصال رویدادها با پاس دادن event (e)
    $('themeBtn').onclick = (e) => toggleTheme(e);
    $('themeSwitch').onclick = (e) => toggleTheme(e);

    const overlay=$('overlay'),sheets=[$('appsSheet'),$('settingsSheet')];
    let returnFocus=null;
    function openSheet(sheet){returnFocus=document.activeElement;overlay.classList.add('show');sheets.forEach(s=>{s.classList.toggle('show',s===sheet);s.setAttribute('aria-hidden',String(s!==sheet))});sheet.querySelector('button,input').focus()}
    function closeSheets(){overlay.classList.remove('show');sheets.forEach(s=>{s.classList.remove('show');s.setAttribute('aria-hidden','true')});returnFocus?.focus()}
    $('appsDockBtn').onclick=()=>openSheet($('appsSheet'));
    $('moreAppsBtn').onclick=()=>openSheet($('appsSheet'));
    $('settingsDockBtn').onclick=()=>openSheet($('settingsSheet'));
    overlay.onclick=closeSheets;
    document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeSheets()});
    $('appSearch').addEventListener('input',()=>{
      const term=$('appSearch').value.trim().toLowerCase();
      let count=0;
      [...$('sheetGrid').children].forEach(a=>{
        const label=a.querySelector('.canva-text');
        const match=a.dataset.app.includes(term)||(label?.textContent||'').toLowerCase().includes(term);
        a.hidden=!match;if(match)count++;
      });
      $('appsEmpty').hidden=count>0;
    });
  </script>
 
</body></html>
